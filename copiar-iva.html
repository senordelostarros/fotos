<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Código + IVA</title>
<style>body{font-family:Arial,sans-serif;background:#1D2126;color:#fff;padding:30px;max-width:900px;margin:auto}h1{color:#FFC72C}textarea{width:100%;height:160px;font-size:15px;border-radius:10px;padding:12px}button{background:#FFC72C;border:0;border-radius:10px;padding:16px 30px;font-size:22px;font-weight:bold;margin-top:14px;cursor:pointer}#ok{color:#6FC8DA;font-size:20px;margin-left:16px}</style></head><body>
<h1>Código "+ IVA" para la portada</h1><p>1) Aprieta el botón amarillo. 2) Vuelve al Editor Visual y pega con cmd + V al final del código.</p>
<textarea id="c" readonly><script>(function(){function f(){document.querySelectorAll('main *, .container *').forEach(function(e){if(e.children.length||e.dataset.iva)return;var t=(e.textContent||'').trim();if(/^\$\d{1,3}(\.\d{3})*$/.test(t)){e.dataset.iva=1;var s=document.createElement('span');s.textContent=' + IVA';s.style.cssText='font-size:.8em;opacity:.75';e.appendChild(s);}});}document.addEventListener('DOMContentLoaded',f);setTimeout(f,1500);})();</script></textarea>
<br><button onclick="var c=document.getElementById('c');c.select();c.setSelectionRange(0,99999);document.execCommand('copy');document.getElementById('ok').textContent='¡Copiado!'">Copiar código</button><span id="ok"></span>
</body></html>
