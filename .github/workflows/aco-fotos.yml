name: Fotos ACO
on:
  push:
    paths: ['aco/pedir.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 trabajo/scripts/aco_fotos.py
      - run: |
          git config user.name "fotos-bot"
          git config user.email "fotos-bot@users.noreply.github.com"
          git add aco
          git commit -m "Fotos ACO descargadas" || echo "sin cambios"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
