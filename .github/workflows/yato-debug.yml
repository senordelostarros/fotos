name: YATO debug
on:
  push:
    paths: ['trabajo/scripts/yato_debug.py']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 trabajo/scripts/yato_debug.py
      - run: |
          git config user.name "fotos-bot"; git config user.email "fotos-bot@users.noreply.github.com"
          git add yato/debug; git commit -m "debug yato" || true; git pull --rebase origin main; git push origin HEAD:main
